<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Assignment 5</title>
    <link rel="stylesheet" href="style.css">
</head>     
<body>
    <h1>My Profile</h1>
    <pre id="profile"></pre>
    <h2>Create / Update Profile</h2>
    <form id="profileForm">
        <label for="username">Username:</label>
        <input type="text" id="username" required><br>
        <label for="birthYear">Birth Year:</label>
        <input type="number" id="birthYear" required><br>
        <button type="submit">Create / Update Profile</button>
    </form>
    <h2>My Tasks</h2>
    <ul id="taskList">
        <li>Complete the assignment</li>
        <li>Play Counter-strike</li>
    </ul>
    <button id="addItem">Add Item</button>
    <button id="removeItem">Remove Item</button>
    <script src="script.js"></script>
</body>
</html>
